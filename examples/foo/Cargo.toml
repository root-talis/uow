[package]
name = "foo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "sqlite" ] }
color-eyre = "0.6"
async-trait = "0.1"
