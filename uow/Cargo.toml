[package]
name = "uow"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A lightweight set of types to express transaction borders in architectures like onion"

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
test-utils = []

sqlx = ["dep:sqlx"]
sqlx-sqlite = ["sqlx", "sqlx/sqlite", "sqlx/runtime-tokio"]
sqlx-postgresql = ["sqlx", "sqlx/postgres", "sqlx/runtime-tokio"]

[dependencies]
async-trait = "0.1"
thiserror = "2"
sqlx = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
